# キット(template/)がLinux環境でセットアップ〜PDF生成まで通ることを検証するワークフロー。
# 全ブランチへのpushとPull Requestで自動実行される。Actionsタブから手動実行も可能(workflow_dispatch)。
# (pull_requestはフォークからのPR用。自リポジトリのブランチはpushで回る)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 日本語フォントはキット同梱のNoto Sans JP(fonts/)を使うため、
      # ランナーへのフォントインストールは不要
      - name: Setup
        working-directory: template
        run: ./setup-docs.sh

      # documents/ 配下の全文書(既定文書+サンプル)を一括ビルドで検証する
      - name: Build all document PDFs
        working-directory: template
        run: ./build-pdf.sh --all

      # 生成されたPDFを実行結果ページからダウンロードして確認できるようにする
      - name: Upload generated PDF
        uses: actions/upload-artifact@v7
        with:
          name: template-sample-pdf
          path: template/dist/*.pdf
          retention-days: 14

  # 最小構成のLinux(node:22-slim、日本語フォントなし・Chromium前提ライブラリなし)でも、
  # setup-docs.shの自動インストールと同梱フォント(fonts/Noto Sans JP)だけで
  # PDF生成まで通ることを検証するジョブ。
  build-template-minimal:
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      # actions/checkoutに必要な最小限のツールを入れる
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      # 失敗時の調査用: ログ末尾を::error::アノテーション(公開ページで閲覧可能)に出す
      - name: Setup
        working-directory: template
        shell: bash
        run: |
          set -o pipefail
          ./setup-docs.sh 2>&1 | tee /tmp/setup.log || {
            msg=$(tail -c 3500 /tmp/setup.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=setup-docs.sh failed::${msg}"
            exit 1
          }

      # 文書名指定のビルド経路を検証する(--all 経路は build-template ジョブで検証)
      - name: Build PDF
        working-directory: template
        shell: bash
        run: |
          set -o pipefail
          ./build-pdf.sh project-document 2>&1 | tee /tmp/build.log || {
            msg=$(tail -c 3500 /tmp/build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-pdf.sh failed::${msg}"
            exit 1
          }

      - name: Upload generated PDF
        uses: actions/upload-artifact@v7
        with:
          name: template-minimal-linux-pdf
          path: template/dist/*.pdf
          retention-days: 14
