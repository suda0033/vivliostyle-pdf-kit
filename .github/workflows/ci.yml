# キット(template/)がLinux環境でセットアップ〜PDF生成まで通ることを検証するワークフロー。
# mainへのpushとPull Requestで自動実行される。Actionsタブから手動実行も可能(workflow_dispatch)。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ubuntuランナーには日本語フォントがなく、入れないとPDFの日本語が全て□(豆腐)になる
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup
        working-directory: template
        run: ./setup-docs.sh

      - name: Build PDF
        working-directory: template
        run: ./build-pdf.sh

      # 生成されたPDFを実行結果ページからダウンロードして確認できるようにする
      - name: Upload generated PDF
        uses: actions/upload-artifact@v7
        with:
          name: template-sample-pdf
          path: template/dist/*.pdf
          retention-days: 14
